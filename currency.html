<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Currency Converter</title>
  <link rel="stylesheet" href="currency.css">
</head>
<body>
  <div class="converter">
    <h1>Currency Converter</h1>
    <div class="form-group">
      <label for="amount">Enter Amount:</label>
      <input type="number" id="amount" placeholder="Enter amount">
    </div>
    <div class="form-group">
      <label for="fromCurrency">From:</label>
      <select id="fromCurrency">
        <option value="1">US Dollar (USD)</option>
        <option value="0.85">Euro (EUR)</option>
        <option value="94.5">Indian Rupee (INR)</option>
        <option value="0.75">British Pound (GBP)</option>
        <option value="110.5">Japanese Yen (JPY)</option>
        <option value="4.18">Malaysian Ringgit (MYR)</option>
        <option value="1.35">Singapore Dollar (SGD)</option>
        <option value="0.91">Swiss Franc (CHF)</option>
        <option value="1.5">Australian Dollar (AUD)</option>
        <option value="6.45">Chinese Yuan (CNY)</option>
      </select>
    </div>
    <div class="form-group">
      <label for="toCurrency">To:</label>
      <select id="toCurrency">
        <option value="1">US Dollar (USD)</option>
        <option value="0.85">Euro (EUR)</option>
        <option value="94.5">Indian Rupee (INR)</option>
        <option value="0.75">British Pound (GBP)</option>
        <option value="110.5">Japanese Yen (JPY)</option>
        <option value="4.18">Malaysian Ringgit (MYR)</option>
        <option value="1.35">Singapore Dollar (SGD)</option>
        <option value="0.91">Swiss Franc (CHF)</option>
        <option value="1.5">Australian Dollar (AUD)</option>
        <option value="6.45">Chinese Yuan (CNY)</option>
      </select>
    </div>
    <button id="convert">Convert</button>
    <div class="result">
      <h2>Converted Amount:</h2>
      <p id="convertedValue">--</p>
    </div>
  </div>
  <script src="currency.js"></script>
</body>
</html>
